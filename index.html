<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eee9e1"><title>Sonhos de Papel</title>
<style>
:root{--paper:#eee9e1;--light:#f8f5ef;--ink:#171513;--sand:#b49c8b;--sand2:#9e8370}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--paper)}body{font-family:Georgia,'Times New Roman',serif;color:var(--ink)}
.page{min-height:100svh;display:grid;place-items:center;padding:12px;background:radial-gradient(circle at 18% 12%,#fff9 0,transparent 34%),radial-gradient(circle at 84% 80%,#b49c8b22 0,transparent 32%),repeating-linear-gradient(94deg,#4b3a2b08 0 1px,transparent 1px 6px),var(--paper);opacity:0;animation:reveal 1.25s ease 3.85s forwards}
.card{position:relative;width:min(94vw,450px);height:min(800px,calc(100svh - 24px));display:flex;flex-direction:column;align-items:center;justify-content:center;padding:34px clamp(25px,8vw,48px);border:1px solid #fff;background:#f8f5ef80;box-shadow:0 18px 55px #31271f14,inset 0 0 0 7px #ffffff55;overflow:hidden}
.seal{position:absolute;width:70px;right:18px;top:18px}.logo{display:block;width:min(100%,360px)}.tag{margin:7px 0 0;text-align:center;font-size:clamp(.78rem,3vw,.95rem);letter-spacing:.19em}.rule{width:44px;height:1px;margin:24px 0;background:var(--sand2)}.promise{margin:0;text-align:center;font-size:clamp(1.08rem,4.5vw,1.32rem);line-height:1.35}
.buttons{width:100%;margin-top:30px;border-top:1px solid #b49c8b88;border-bottom:1px solid #b49c8b88}.btn{position:relative;min-height:55px;display:flex;align-items:center;justify-content:center;gap:12px;padding:0 32px;text-decoration:none;font:italic 1rem/1 Georgia,'Times New Roman',serif;letter-spacing:.02em;color:var(--ink);background:transparent;transition:.25s ease}.btn+ .btn{border-top:1px solid #b49c8b55}.btn svg{width:19px;height:19px;color:var(--sand2)}.btn:after{content:'›';position:absolute;right:12px;font:23px Georgia;color:var(--sand2)}.btn:active{background:#fff5}.small{margin:25px 0 0;text-align:center;color:#796b60;font:500 .66rem/1.5 Arial,sans-serif;letter-spacing:.15em;text-transform:uppercase}
.intro{position:fixed;z-index:9;inset:0;overflow:hidden;background:radial-gradient(circle at center,#faf7f1,var(--paper));animation:introOut 1.05s ease 3.55s forwards;pointer-events:none}.celeste{position:absolute;width:min(72vw,315px);left:-66vw;top:35%;filter:drop-shadow(0 12px 22px #7d665225);animation:fly 4.05s cubic-bezier(.18,.58,.3,1) forwards}.spark{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 6px 2px #d8c2ac,0 0 14px 5px #fff8;opacity:0}.s1{left:18%;top:57%;animation:twinkle 1.15s .8s}.s2{left:35%;top:44%;animation:twinkle 1.25s 1.35s}.s3{left:52%;top:55%;animation:twinkle 1.15s 1.9s}.s4{left:69%;top:36%;animation:twinkle 1.25s 2.4s}.s5{left:84%;top:49%;animation:twinkle 1.2s 2.85s}
@keyframes fly{0%{transform:translate(-8vw,20vh) rotate(-5deg) scale(.66);opacity:0}12%{opacity:.92}38%{transform:translate(52vw,2vh) rotate(-2deg) scale(.76)}68%{transform:translate(105vw,-7vh) rotate(1deg) scale(.82);opacity:1}100%{transform:translate(172vw,-20vh) rotate(4deg) scale(.88);opacity:0}}@keyframes twinkle{0%,100%{opacity:0;transform:scale(.15)}48%{opacity:1;transform:scale(1)}}@keyframes introOut{to{opacity:0;visibility:hidden}}@keyframes reveal{to{opacity:1}}
@media(max-height:690px){.card{padding-top:22px;padding-bottom:22px}.seal{width:54px}.rule{margin:15px 0}.buttons{margin-top:18px}.small{margin-top:14px}}
@media(prefers-reduced-motion:reduce){.intro{display:none}.page{opacity:1;animation:none}}
</style></head><body>
